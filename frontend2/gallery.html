<!-- frontend/gallery.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Uploaded Images Gallery</h1>
    <div id="grid"></div>
    <p><a href="/">Back</a></p>
  </div>
  <script>
    async function loadGallery() {
      const res = await fetch('/api/gallery');
      const items = await res.json();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${it.image_url}" width="200"><br>
          <strong>Label:</strong> ${it.label} <br>
          <strong>Conf:</strong> ${it.confidence ? it.confidence.toFixed(3) : 'N/A'} <br>
          <strong>Uploaded:</strong> ${it.uploaded_at}<br>
          <p>${it.explanation || ''}</p>
          <a href="${it.cam_url}" target="_blank">View CAM</a>
        `;
        grid.appendChild(card);
      });
    }
    loadGallery();
  </script>
</body>
</html>
